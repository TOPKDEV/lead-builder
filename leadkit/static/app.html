<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Lead Builder</title>
<style>
:root {
  --bg: #f6f5f1; --bg2: #efede6; --card: #ffffff; --ink: #14151a; --muted: #5f6270; --faint: #8b8e9b;
  --line: #e6e3da; --line2: #d7d3c7; --soft: #f1efe8;
  --accent: #4535f0; --accent-hi: #5a4bff; --accent-ink: #ffffff; --accent-soft: #ecebff; --accent-line: #c9c5ff;
  --ok: #17803d; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fcf0d6; --bad: #bf2a1c; --bad-soft: #fcebe8;
  --shadow: 0 1px 2px rgba(20,21,26,.05), 0 8px 24px -12px rgba(20,21,26,.12);
  --shadow-lg: 0 2px 4px rgba(20,21,26,.06), 0 24px 48px -16px rgba(20,21,26,.22);
  --r: 16px; --r-sm: 10px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1013; --bg2: #14151a; --card: #181a20; --ink: #eeeef2; --muted: #a2a5b3; --faint: #737688;
    --line: #272a33; --line2: #343846; --soft: #1e2028;
    --accent: #8f8cff; --accent-hi: #a3a1ff; --accent-ink: #0d0c24; --accent-soft: #22224a; --accent-line: #3b3a86;
    --ok: #55d184; --ok-soft: #14291d; --warn: #f0b955; --warn-soft: #2f2410; --bad: #ff8b7e; --bad-soft: #351916;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset; --shadow-lg: 0 24px 48px -16px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans);
  background-image: radial-gradient(900px 380px at 50% -140px, var(--accent-soft), transparent 70%);
  background-repeat: no-repeat; min-height: 100vh; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-line); outline-offset: 2px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; } .mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* shell */
.top { position: sticky; top: 0; z-index: 30; backdrop-filter: saturate(1.4) blur(14px); background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top-in { max-width: 920px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.02em; font-size: 17px; color: var(--ink); text-decoration: none; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.mark svg { width: 18px; height: 18px; }
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav a { position: relative; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 550; padding: 7px 12px; border-radius: 99px; }
.nav a:hover { color: var(--ink); background: var(--soft); }
.nav a.on { color: var(--ink); background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.nav .dot { position: absolute; top: 5px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--bg); }
main { max-width: 920px; margin: 0 auto; padding: 34px 20px 80px; }
main.pad-bar { padding-bottom: 190px; }
.page-title { font-size: clamp(28px, 5vw, 40px); line-height: 1.08; letter-spacing: -.035em; font-weight: 780; }
.page-lead { color: var(--muted); font-size: 17px; margin-top: 10px; max-width: 60ch; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; text-decoration: none; margin-bottom: 14px; font-weight: 550; }
.back:hover { color: var(--ink); }
svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 12px; padding: 11px 20px; font-weight: 650; background: var(--accent); color: var(--accent-ink); text-decoration: none; transition: transform .08s, background .15s, box-shadow .15s; box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 6px 16px -8px var(--accent); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--accent-hi); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.lg { padding: 14px 26px; font-size: 16px; border-radius: 14px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line2); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: var(--soft); }
.btn.danger { background: var(--bad-soft); color: var(--bad); box-shadow: none; border-color: transparent; }
.btn.sm { padding: 7px 14px; font-size: 14px; border-radius: 10px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.input { width: 100%; padding: 11px 14px; border: 1px solid var(--line2); border-radius: 12px; background: var(--card); color: var(--ink); }
.input:focus { outline: 3px solid var(--accent-line); outline-offset: 0; border-color: var(--accent); }
select.input { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.card + .card, .card + .term, .term + .card, .note + .card, .card + .note { margin-top: 16px; }
.note { border-radius: var(--r); padding: 18px 20px; background: var(--accent-soft); }
.note.ok { background: var(--ok-soft); } .note.warn { background: var(--warn-soft); } .note.bad { background: var(--bad-soft); }
.note h2, .card h2 { font-size: 19px; letter-spacing: -.02em; }
.note p, .card p { margin-top: 6px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1 1 200px; min-width: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--muted); letter-spacing: .01em; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.run { background: var(--accent-soft); color: var(--accent); }
.pill .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
th { border-top: 0; background: var(--soft); color: var(--muted); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 750; background: var(--soft); }
.bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-hi)); transition: width .6s ease; }
.bar.spend > i { background: linear-gradient(90deg, var(--ok), color-mix(in srgb, var(--ok) 60%, white)); }
.bar.indet > i { width: 35% !important; animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

/* toasts */
.toasts { position: fixed; z-index: 100; top: 70px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(440px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-size: 14.5px; box-shadow: var(--shadow-lg); animation: tin .25s ease; display: flex; gap: 10px; align-items: flex-start; }
.toast.bad { background: var(--bad); color: #fff; } .toast.ok { background: var(--ok); color: #fff; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* home */
.hero { margin-bottom: 26px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.onboard { border: 1px solid var(--accent-line); background: linear-gradient(135deg, var(--accent-soft), var(--card)); margin-bottom: 20px; }
.onboard ol { list-style: none; counter-reset: o; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.onboard li { counter-increment: o; display: flex; gap: 12px; align-items: center; color: var(--muted); }
.onboard li::before { content: counter(o); width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
.jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
a.job { display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s, box-shadow .15s; min-width: 0; }
a.job:hover { transform: translateY(-2px); border-color: var(--accent-line); box-shadow: var(--shadow-lg); }
a.job .t { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
a.job h2 { font-size: 18px; letter-spacing: -.02em; overflow-wrap: anywhere; }
a.job .d { color: var(--muted); font-size: 14px; margin-top: 3px; overflow-wrap: anywhere; }
a.job .s { display: flex; gap: 22px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
a.job .s b { display: block; font-size: 20px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
a.job .s span { font-size: 12px; color: var(--muted); }
.empty { text-align: center; padding: 48px 24px; border: 2px dashed var(--line2); border-radius: var(--r); color: var(--muted); }

/* wizard */
.wiz { counter-reset: s; margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.wiz > *, main > * { min-width: 0; }
.step { counter-increment: s; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.step > h2 { display: flex; gap: 12px; align-items: center; font-size: 19px; letter-spacing: -.02em; }
.step > h2::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.step > .sub { color: var(--muted); font-size: 14.5px; margin: 6px 0 0 40px; }
.step > .body { margin-top: 16px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { text-align: left; background: var(--bg2); border: 2px solid transparent; border-radius: 14px; padding: 18px; display: grid; gap: 4px; transition: border-color .15s, background .15s, transform .1s; }
.mode:hover { border-color: var(--accent-line); }
.mode[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
.mode .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--card); display: grid; place-items: center; color: var(--accent); margin-bottom: 8px; box-shadow: 0 0 0 1px var(--line); }
.mode .ic svg { width: 22px; height: 22px; }
.mode b { font-size: 17px; letter-spacing: -.015em; } .mode span { color: var(--muted); font-size: 14.5px; }
.tagbox { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; min-height: 54px; border: 1px solid var(--line2); border-radius: 14px; background: var(--bg); cursor: text; transition: border-color .15s, box-shadow .15s; }
.tagbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); background: var(--card); }
.tagbox > input { flex: 1 1 160px; min-width: 120px; border: 0; outline: 0; background: transparent; padding: 6px 2px; font-size: 16px; }
.tagbox .busy { margin-left: auto; }
.tag { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 10px; padding: 4px 4px 4px 10px; font-size: 14.5px; animation: pop .18s ease; max-width: 100%; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.tag .k { font-size: 10.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tag .l { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag .p { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.tag button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 7px; color: var(--muted); display: grid; place-items: center; padding: 0; }
.tag button:hover { background: var(--card); color: var(--bad); }
.pop { position: absolute; z-index: 20; left: -1px; right: -1px; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; background: var(--card); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow-lg); max-height: 330px; overflow-y: auto; }
.pop li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.pop li[aria-selected=true] { background: var(--accent-soft); }
.pop li.chosen { opacity: .5; }
.pop li.msg { color: var(--muted); cursor: default; font-size: 14px; }
.pop .badge { font-size: 10.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 7px; background: var(--soft); color: var(--muted); min-width: 52px; text-align: center; flex: none; }
.pop .badge.county { background: var(--accent-soft); color: var(--accent); } .pop .badge.city { background: var(--ok-soft); color: var(--ok); } .pop .badge.zip { background: var(--warn-soft); color: var(--warn); }
.pop .tx { min-width: 0; flex: 1; } .pop .tx b { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .tx small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .pp { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.hintline { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13.5px; }
.try { border: 1px dashed var(--line2); background: transparent; border-radius: 99px; padding: 3px 11px; font-size: 13px; color: var(--muted); }
.try:hover { color: var(--accent); border-color: var(--accent); }
.areas-sum { margin-top: 12px; font-size: 14px; color: var(--muted); }
.areas-sum b { color: var(--ink); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--accent-line); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.opt input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.opt b { display: block; font-weight: 650; } .opt small { display: block; color: var(--muted); font-size: 13.5px; }
.opt .share { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.drop { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 38px 20px; border: 2px dashed var(--line2); border-radius: 16px; background: var(--bg); cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.drop:hover, .drop:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); border-style: solid; transform: scale(1.01); }
.drop .up { width: 52px; height: 52px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; color: var(--accent); margin-bottom: 6px; transition: transform .2s; }
.drop.over .up { transform: translateY(-4px); }
.drop .up svg { width: 26px; height: 26px; }
.drop b { font-size: 17px; }
.filechip { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; background: var(--ok-soft); }
.filechip .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--card); color: var(--ok); display: grid; place-items: center; flex: none; }
.filechip b { overflow-wrap: anywhere; }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 18px; }
.map label { display: grid; gap: 5px; font-size: 13px; font-weight: 650; color: var(--muted); }
.map label.miss select { border-color: var(--warn); }
.sub-h { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
.addon { border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; transition: border-color .15s, background .15s; background: var(--card); }
.addon.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--card)); }
.addon + .addon { margin-top: 12px; }
.addon-h { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; }
.addon-h .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--soft); color: var(--muted); display: grid; place-items: center; flex: none; }
.addon.on .addon-h .ic { background: var(--accent); color: var(--accent-ink); }
.addon-h .tx { flex: 1; min-width: 0; } .addon-h b { display: block; font-size: 16.5px; letter-spacing: -.01em; }
.addon-h .d { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.addon-h .pr { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); background: var(--soft); border-radius: 99px; padding: 3px 10px; }
.sw { position: relative; width: 46px; height: 28px; flex: none; margin-top: 4px; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 99px; background: var(--line2); transition: background .2s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.sw input:checked + i { background: var(--accent); } .sw input:checked + i::after { transform: translateX(18px); }
.sw input:focus-visible + i { outline: 3px solid var(--accent-line); outline-offset: 2px; }
.addon-sub { margin: 14px 0 0 52px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 8px; }
.addon-sub .opt { padding: 10px 12px; border-width: 1px; }
.addon-sub h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 650; }
.addon-sub p { font-size: 13.5px; color: var(--muted); margin: 0; }
.nameinp { max-width: 420px; }

/* sticky bar */
.dock { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
.dock-in { pointer-events: auto; max-width: 920px; margin: 0 auto; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(16px) saturate(1.4); border: 1px solid var(--line2); border-radius: 20px; box-shadow: var(--shadow-lg); }
.dock-main { display: flex; align-items: center; gap: 16px; padding: 12px 14px 12px 20px; }
.est { flex: 1; min-width: 0; }
.est .lab { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.est .val { font-size: 26px; font-weight: 780; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.est .val small { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-right: 4px; }
.est .sub { font-size: 12.5px; color: var(--muted); }
.est .hint { font-size: 15px; color: var(--muted); font-weight: 550; padding: 6px 0; }
